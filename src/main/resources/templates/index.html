<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Agenda - Sala de Eventos La Negrita</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body class="bg-light">

        <div class="container py-5">
            <header class="text-center mb-5">
                <h1 class="fw-bold text-dark">📅 Agenda - Sala de Eventos La Negrita</h1>
            </header>

            <div class="row g-4">
                <!-- Formulario -->
                <div class="col-md-4">
                    <div class="card shadow-sm border-0">
                        <div class="card-body">
                            <h4 class="card-title text-center mb-3">Nuevo Evento</h4>
                            <form th:action="@{/guardar}" th:object="${evento}" method="post">

                                <div class="mb-3">
                                    <label for="nombre" class="form-label">Cliente</label>
                                    <input type="text" class="form-control" id="nombre" th:field="*{nombre}" required>
                                </div>
                                <div class="mb-3">
                                    <label for="celular" class="form-label">Número Celular</label>
                                    <input type="number" class="form-control" id="celular" th:field="*{celular}" min="1" required>
                                </div>
                                <div class="mb-3">
                                    <label for="tipoEvento" class="form-label">Tipo de Evento</label>
                                    <select class="form-select" id="tipoEvento" th:field="*{tipoEvento}" required>
                                        <option value="" disabled selected>Selecciona una opción...</option>
                                        <option value="Boda">Boda</option>
                                        <option value="Primera Comunión">Primera Comunión</option>
                                        <option value="Cumpleaños">Cumpleaños</option>
                                        <option value="Baby Shower">Baby Shower</option>
                                        <option value="Capacitación">Capacitación</option>
                                        <option value="Graduación">Graduación</option>
                                    </select>
                                </div>
                                <div class="mb-3">
                                    <label for="descripcion" class="form-label">Descripción</label>
                                    <textarea class="form-control" id="descripcion" th:field="*{descripcion}" rows="3" required></textarea>
                                </div>
                                <div class="mb-3">
                                    <label for="fecha" class="form-label">Fecha</label>
                                    <input type="date" class="form-control" id="fecha" th:field="*{fecha}" required>
                                </div>
                                <div class="mb-3">
                                    <label for="personas" class="form-label">Cantidad de Personas</label>
                                    <input type="number" class="form-control" id="personas" th:field="*{personas}" min="1" value="1" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label d-block">Paquete</label>
                                    <div class="form-check form-check-inline">
                                        <input class="form-check-input" type="radio" name="paquete" id="paquete1" value="Económico" th:field="*{paquete}" checked>
                                        <label class="form-check-label" for="paquete1">Económico</label>
                                    </div>
                                    <div class="form-check form-check-inline">
                                        <input class="form-check-input" type="radio" name="paquete" id="paquete2" value="Todo Incluido" th:field="*{paquete}">
                                        <label class="form-check-label" for="paquete2">Todo Incluido</label>
                                    </div>
                                    <div class="form-check form-check-inline">
                                        <input class="form-check-input" type="radio" name="paquete" id="paquete3" value="Completo" th:field="*{paquete}">
                                        <label class="form-check-label" for="paquete3">Completo</label>
                                    </div>
                                </div>
                                <button type="submit" class="btn btn-warning w-100">Guardar Evento</button>
                            </form>
                        </div>
                    </div>
                </div>

                <!-- Tabla de Eventos -->
                <div class="col-md-8">
                    <div class="card shadow-sm border-0">
                        <div class="card-body">
                            <h4 class="card-title text-center mb-3">Eventos Programados</h4>
                            <div class="table-responsive">
                                <table class="table table-hover align-middle">
                                    <thead class="table-dark">
                                        <tr>
                                            <th>Cliente</th>
                                            <th>Celular</th>
                                            <th>Tipo</th>
                                            <th>Fecha</th>
                                            <th>Personas</th>
                                            <th>Paquete</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr th:each="e : ${eventos}">
                                            <td class="fw-bold" th:text="${e.nombre}"></td>
                                            <td th:text="${e.celular}"></td>
                                            <td th:text="${e.tipoEvento}"></td>
                                            <td class="text-secondary" th:text="${e.fecha}"></td>
                                            <td class="text-center" th:text="${e.personas}"></td>
                                            <td><span class="badge bg-warning text-dark" th:text="${e.paquete}"></span></td>
                                        </tr>
                                        <tr th:if="${#lists.isEmpty(eventos)}">
                                            <td colspan="6" class="text-center text-muted py-4">No hay eventos registrados.</td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
